<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FITNESS AG | كابتن أحمد جمال - مدرب ومثقف سكري معتمد</title>
    
    <!-- خطوط جوجل العصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6600;
            --primary-light: #ff9955;
            --primary-glow: rgba(255, 102, 0, 0.5);
            --diabetes-blue: #00A4E4;
            --diabetes-glow: rgba(0, 164, 228, 0.4);
            --bg-dark: #050507;
            --bg-card: rgba(20, 21, 26, 0.65);
            --bg-card-hover: rgba(30, 32, 40, 0.85);
            --text-light: #f8f9fa;
            --text-muted: #a0a4b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --whatsapp-green: #25d366;
            --zoom-blue: #2D8CFF;
            
            --font-head: 'Alexandria', sans-serif;
            --font-body: 'Tajawal', sans-serif;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 102, 0, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        html, body {
            margin: 0; padding: 0; box-sizing: border-box; 
            scroll-behavior: smooth; width: 100%; overflow-x: hidden;
        }
        
        *, *::before, *::after { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            line-height: 1.7; 
            font-family: var(--font-body);
            position: relative;
        }

        .bg-animations {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .bg-orb {
            position: absolute; border-radius: 50%; filter: blur(90px);
            animation: floatOrb 15s infinite alternate ease-in-out;
            opacity: 0.15;
        }
        .orb-orange { width: 450px; height: 450px; background: var(--primary); top: -10%; right: -10%; }
        .orb-blue { width: 400px; height: 400px; background: var(--diabetes-blue); bottom: -10%; left: -5%; animation-delay: -5s; }
        .orb-small { width: 250px; height: 250px; background: #e65c00; top: 40%; left: 30%; animation-duration: 20s; opacity: 0.08; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 40px) scale(1.1); }
            100% { transform: translate(40px, -20px) scale(0.9); }
        }

        .parallax-figures {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .p-fig {
            position: absolute; opacity: 0.04; font-size: 5rem;
            will-change: transform; transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .p-fig-1 { top: 15%; left: 8%; font-size: 10rem; color: var(--primary); }
        .p-fig-2 { top: 45%; right: 12%; font-size: 8rem; color: var(--diabetes-blue); }
        .p-fig-3 { top: 75%; left: 20%; font-size: 12rem; color: #fff; }
        .p-fig-4 { top: 25%; right: 25%; font-size: 9rem; color: var(--whatsapp-green); opacity: 0.03; }
        .p-fig-5 { top: 85%; right: 15%; font-size: 7rem; color: var(--primary-light); }
        .p-fig-6 { top: 55%; left: 5%; font-size: 14rem; color: var(--diabetes-blue); opacity: 0.02; }

        h1, h2, h3, h4, .nav-links a, .btn-main, .btn-wa, .pkg-price, .step-num, .tab-btn, .cheer-title {
            font-family: var(--font-head);
        }

        .text-logo {
            font-family: var(--font-head); font-size: 1.8rem; font-weight: 900;
            color: #fff; text-decoration: none; display: flex; align-items: center;
            gap: 6px; letter-spacing: 1px; transition: 0.3s;
        }
        .text-logo span {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .text-logo:hover { transform: scale(1.05); filter: drop-shadow(0 0 10px var(--primary-glow)); }
        .footer-logo { font-size: 2.5rem; justify-content: center; margin-bottom: 25px; }

        #floating-pen {
            position: fixed; top: 25%; right: 8%; z-index: 50; pointer-events: none;
            transition: transform 0.1s ease-out; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)) drop-shadow(0 0 10px var(--primary-glow)); 
            opacity: 0.9;
        }

        header { 
            position: fixed; top: 20px; left: 0; right: 0; margin: 0 auto;
            width: 92%; max-width: 1200px; background: rgba(15, 15, 18, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; }
        .nav-links { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; transition: 0.3s; position: relative; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover { color: var(--primary-light); }
        .nav-links a:hover::after { width: 100%; }
        .nav-btn { background: linear-gradient(135deg, var(--primary), #e65c00); color: #fff; padding: 10px 24px; border-radius: 30px; text-decoration: none; font-size: 0.9rem; box-shadow: 0 5px 15px var(--primary-glow); transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; font-family: var(--font-head); font-weight: 700; }
        .nav-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 102, 0, 0.6); }

        .text-gradient { background: linear-gradient(135deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-blue { background: linear-gradient(135deg, var(--diabetes-blue), #55c2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .hero { min-height: 100vh; display: flex; align-items: center; padding: 150px 20px 60px; max-width: 1200px; margin: 0 auto; position: relative; }
        .hero-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 50px; align-items: center; width: 100%; position: relative; z-index: 2; }
        
        .champion-badge { 
            background: rgba(0, 164, 228, 0.1); border: 1px solid rgba(0,164,228,0.4); color: #55c2ff; 
            padding: 8px 20px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; 
            display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px;
            animation: pulseBlue 2s infinite; font-family: var(--font-head);
        }
        @keyframes pulseBlue { 0% { box-shadow: 0 0 0 0 rgba(0, 164, 228, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 164, 228, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 164, 228, 0); } }

        .hero h1 { font-size: 3.5rem; line-height: 1.3; margin-bottom: 25px; letter-spacing: -1px; }
        .hero p { color: var(--text-muted); font-size: 1.15rem; margin-bottom: 35px; line-height: 1.9; font-weight: 500; }
        .hero-btns { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-main, .btn-wa { padding: 16px 36px; border-radius: 14px; text-decoration: none; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.4s ease; color: #fff; text-align: center; font-weight: 700; }
        .btn-main { background: linear-gradient(135deg, var(--primary), #e65c00); box-shadow: 0 10px 25px rgba(255,102,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .btn-wa { background: rgba(37,211,102,0.1); backdrop-filter: blur(10px); color: var(--whatsapp-green); border: 1px solid rgba(37,211,102,0.3); }
        .btn-wa:hover { background: var(--whatsapp-green); color: #fff; box-shadow: 0 10px 25px rgba(37,211,102,0.3); }
        .btn-main:hover { transform: translateY(-4px) scale(1.02); filter: brightness(1.1); }
        
        .hero-img-box { position: relative; width: 100%; display: flex; justify-content: center; }
        .hero-img-box::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110%; height: 110%; background: radial-gradient(circle, var(--primary-glow) 0%, transparent 65%); z-index: -1; }
        .hero-img { width: 100%; max-width: 480px; height: auto; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.6); animation: float 6s ease-in-out infinite; object-fit: cover; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }

        section { padding: 80px 20px; max-width: 1200px; margin: 0 auto; position: relative; width: 100%; z-index: 2; }
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 { font-size: 2.8rem; margin-bottom: 15px; }
        .section-header p { color: var(--text-muted); max-width: 650px; margin: 0 auto; font-size: 1.15rem; }

        .glass-card { background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-light); border-radius: 24px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(255,102,0,0.3); background: var(--bg-card-hover); }
        
        .notice-banner { background: linear-gradient(90deg, rgba(20,21,26,0.9), rgba(39,20,6,0.9)); border-right: 4px solid var(--primary); padding: 30px; border-radius: 20px; margin: 0 auto 60px; max-width: 1200px; border: 1px solid var(--border-light); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .notice-banner h3 { color: var(--primary-light); margin-bottom: 15px; font-size: 1.4rem; }
        .notice-banner ul { padding-right: 15px; margin: 0; }
        .notice-banner li { color: #e5e7eb; font-size: 1.05rem; margin-bottom: 10px; list-style: none; display: flex; gap: 12px; align-items: flex-start; }
        .notice-banner li::before { content: "\f104"; font-family: "Font Awesome 6 Free"; font-weight: 900; color: var(--primary); font-size: 0.9rem; margin-top: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; }
        .stat-item { padding: 40px 15px; text-align: center; }
        .stat-item h3 { font-size: 3.2rem; margin-bottom: 5px; line-height: 1; }
        .stat-item p { color: var(--text-muted); font-weight: 700; font-size: 1.15rem; font-family: var(--font-head); }

        .about-box { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; padding: 50px; }
        .cred-list { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 20px; padding: 0; }
        .cred-list li { display: flex; align-items: center; gap: 18px; color: #e5e7eb; font-size: 1.1rem; }
        .cred-list li i { color: var(--primary); width: 50px; height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,102,0,0.1); border-radius: 14px; border: 1px solid rgba(255,102,0,0.2); font-size: 1.3rem; }
        .community-box { background: rgba(0,0,0,0.4); padding: 40px; border-radius: 24px; border: 1px solid var(--border-light); position: relative; overflow: hidden; }
        .community-box::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--diabetes-blue); }

        .victory-wrapper { text-align: center; margin: 30px auto 60px; position: relative; z-index: 5; }
        .victory-icon-box {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 120px; height: 120px; margin-bottom: 15px;
        }
